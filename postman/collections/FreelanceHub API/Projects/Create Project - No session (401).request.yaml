$kind: http-request
description: "بدون جلسة. المتوقع: 401."
url: "{{baseUrl}}/projects"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: No Session
    - type: text
      key: description
      value: Should be unauthorized
    - type: text
      key: budget
      value: "100"
    - type: text
      key: categoryId
      value: "{{categoryId}}"
scripts:
  - type: afterResponse
    code: pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
