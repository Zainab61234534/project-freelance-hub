$kind: http-request
description: "UUID صالح لكن غير موجود. المتوقع: 404 Category not found."
url: "{{baseUrl}}/projects"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Unknown Category
    - type: text
      key: description
      value: Category does not exist
    - type: text
      key: budget
      value: "100"
    - type: text
      key: categoryId
      value: 123e4567-e89b-42d3-a456-426614174000
scripts:
  - type: afterResponse
    code: pm.test('404 Not Found', () => pm.response.to.have.status(404));
    language: text/javascript
order: 4000
