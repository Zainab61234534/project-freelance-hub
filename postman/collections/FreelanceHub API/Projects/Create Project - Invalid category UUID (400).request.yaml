$kind: http-request
description: "المتوقع: 400 categoryId must be a UUID."
url: "{{baseUrl}}/projects"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Invalid Category
    - type: text
      key: description
      value: Bad uuid
    - type: text
      key: budget
      value: "100"
    - type: text
      key: categoryId
      value: not-a-uuid
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
