$kind: http-request
description: "ملاحظة: multer في المشروع يرمي Error عادي وليس BadRequestException لذلك الرد الحالي 500 بدلاً من 400. أرفق ملفاً غير مسموح."
url: "{{baseUrl}}/projects"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Invalid Attachment
    - type: text
      key: description
      value: Attach .txt or >5MB file
    - type: text
      key: budget
      value: "100"
    - type: text
      key: categoryId
      value: "{{categoryId}}"
    - type: file
      key: attachment
      src:
        - ""
scripts:
  - type: afterResponse
    code: pm.test('500 Server Error', () => pm.response.to.have.status(500));
    language: text/javascript
order: 7000
