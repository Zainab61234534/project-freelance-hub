$kind: http-request
name: List Projects - Invalid page/limit (400)
description: "المتوقع: 400 (page>=1 و limit<=50)."
url: "{{baseUrl}}/projects?page=0&limit=51"
method: GET
queryParams:
  page: "0"
  limit: "51"
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 15000
