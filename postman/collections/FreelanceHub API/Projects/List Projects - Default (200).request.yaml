$kind: http-request
description: "المتوقع: 200 {data, pagination{total,page,limit,totalPages}} — يعرض المشاريع المفتوحة OPEN فقط."
url: "{{baseUrl}}/projects"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('has pagination', () => pm.expect(pm.response.json().pagination).to.exist);
    language: text/javascript
order: 8000
