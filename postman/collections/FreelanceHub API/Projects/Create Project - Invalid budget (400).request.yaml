$kind: http-request
description: "المتوقع: 400 budget must not be less than 0.01."
url: "{{baseUrl}}/projects"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Invalid Budget
    - type: text
      key: description
      value: Budget must be >= 0.01
    - type: text
      key: budget
      value: "0"
    - type: text
      key: categoryId
      value: "{{categoryId}}"
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
