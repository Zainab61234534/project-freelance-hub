$kind: http-request
description: "تحديث جزئي. المتوقع: 200."
url: "{{baseUrl}}/freelancer-profile/me"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: bio
      value: Updated bio
    - type: text
      key: hourlyRate
      value: "35.00"
    - type: file
      key: profileImage
      src:
        - ""
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000
