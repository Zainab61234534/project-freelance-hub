$kind: http-request
description: "سجّل دخول كـ CLIENT. المتوقع: 403 Only freelancers can create a profile."
url: "{{baseUrl}}/freelancer-profile"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: bio
      value: I am a client
    - type: text
      key: hourlyRate
      value: "10"
scripts:
  - type: afterResponse
    code: pm.test('403 Forbidden', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
