$kind: http-request
description: "المتوقع: 401 Invalid email or password (نفس الرد للبريد غير الموجود)."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{freelancerEmail}}",
      "password": "WrongPassword123"
    }
scripts:
  - type: afterResponse
    code: pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
