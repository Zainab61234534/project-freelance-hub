$kind: http-request
description: "المتوقع: 200 {message,user} مع Set-Cookie: fh_session. محدود بـ 5 محاولات/دقيقة."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{freelancerEmail}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('sets fh_session cookie', () => {
        const cookies = pm.response.headers.all().filter(h => h.key.toLowerCase() === 'set-cookie');
        pm.expect(cookies.length).to.be.greaterThan(0);
      });
    language: text/javascript
order: 7000
