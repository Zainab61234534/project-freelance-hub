$kind: http-request
description: "بريد مسجل مسبقاً. المتوقع: 409 Email already exists."
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Another User",
      "email": "{{freelancerEmail}}",
      "password": "{{password}}",
      "role": "FREELANCER"
    }
scripts:
  - type: afterResponse
    code: pm.test('409 Conflict', () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
