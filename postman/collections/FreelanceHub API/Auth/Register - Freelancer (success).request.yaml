$kind: http-request
description: "ينشئ مستخدم FREELANCER + محفظة. المتوقع: 201 مع id/name/email/role/createdAt."
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Test Freelancer",
      "email": "{{freelancerEmail}}",
      "password": "{{password}}",
      "role": "FREELANCER"
    }
scripts:
  - type: afterResponse
    code: pm.test('201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
