$kind: http-request
description: "لتجربة 403 عند تعديل/حذف مشروع لا يملكه. المتوقع: 200."
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{otherClientEmail}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 12000
