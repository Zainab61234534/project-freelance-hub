$kind: http-request
description: "ينشئ مستخدم CLIENT + محفظة. المتوقع: 201."
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Test Client",
      "email": "{{clientEmail}}",
      "password": "{{password}}",
      "role": "CLIENT"
    }
scripts:
  - type: afterResponse
    code: pm.test('201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
