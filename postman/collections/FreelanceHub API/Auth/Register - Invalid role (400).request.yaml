$kind: http-request
description: "RegisterRole يسمح فقط بـ CLIENT أو FREELANCER. المتوقع: 400."
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Admin Attempt",
      "email": "admin@example.com",
      "password": "{{password}}",
      "role": "ADMIN"
    }
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
