$kind: http-request
url: "{{baseUrl}}/deliveries/{{deliveryId}}/download"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("الترويسة attachment", function () { pm.expect(pm.response.headers.get("Content-Disposition") || "").to.include("attachment"); });
    language: text/javascript
order: 5000
