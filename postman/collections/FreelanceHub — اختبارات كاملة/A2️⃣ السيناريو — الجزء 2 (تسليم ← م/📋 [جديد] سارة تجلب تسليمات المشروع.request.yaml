$kind: http-request
description: Endpoint أضفته حسب ملخصك. إن لم يكن موجوداً بهذا المسار عدّل المسار.
url: "{{baseUrl}}/deliveries/projects/{{projectId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const list = Array.isArray(j) ? j : (j.deliveries || j.data || []);
      pm.test("يوجد تسليم واحد على الأقل", function () { pm.expect(list.length).to.be.above(0); });
      pm.test("لا يُكشف fileUrl", function () { pm.expect(list[0].fileUrl).to.be.undefined; });
      if (list[0] && list[0].id) { pm.collectionVariables.set("deliveryId", list[0].id); }
    language: text/javascript
order: 4000
