$kind: http-request
url: "{{baseUrl}}/wallet/transactions"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("PAYMENT_RECEIVED بقيمة 180", function () { const p = (j.transactions || []).filter(function (x) { return x.type === "PAYMENT_RECEIVED"; }); pm.expect(p.length).to.eql(1); pm.expect(parseFloat(p[0].amount)).to.eql(180); });
    language: text/javascript
order: 13000
