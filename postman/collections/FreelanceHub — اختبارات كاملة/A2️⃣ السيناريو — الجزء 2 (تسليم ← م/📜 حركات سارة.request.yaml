$kind: http-request
url: "{{baseUrl}}/wallet/transactions?limit=20"
method: GET
queryParams:
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("فيها RESERVATION_CAPTURE", function () { const ty = (j.transactions || []).map(function (x) { return x.type; }); pm.expect(ty).to.include.members(["DEPOSIT", "RESERVE", "RESERVATION_CAPTURE"]); });
    language: text/javascript
order: 10000
