$kind: http-request
url: "{{baseUrl}}/deliveries/{{deliveryId}}/review"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "APPROVED"
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("الإجمالي 200", function () { pm.expect(parseFloat(j.totalAmount)).to.eql(200); });
      pm.test("المستقل 180", function () { pm.expect(parseFloat(j.freelancerShare)).to.eql(180); });
      pm.test("المنصة 20", function () { pm.expect(parseFloat(j.platformFee)).to.eql(20); });
    language: text/javascript
order: 6000
