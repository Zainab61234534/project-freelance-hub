$kind: http-request
description: ⚠️ اضغط على حقل file واختر ملف PDF أو ZIP صغيراً من جهازك (مطلوب).
url: "{{baseUrl}}/deliveries/projects/{{projectId}}"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.test("حالة PENDING", function () { pm.expect(j.delivery.status).to.eql("PENDING"); });
      if (j.delivery && j.delivery.id) { pm.collectionVariables.set("deliveryId", j.delivery.id); }
    language: text/javascript
order: 2000
