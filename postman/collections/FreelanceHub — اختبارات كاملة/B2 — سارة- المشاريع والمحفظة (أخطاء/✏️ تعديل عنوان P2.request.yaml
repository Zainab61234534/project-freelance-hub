$kind: http-request
url: "{{baseUrl}}/projects/{{project2Id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Project-P2-{{runId}} edited"
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("العنوان تغيّر", function () { pm.expect(j.title).to.include("edited"); });
    language: text/javascript
order: 17000
