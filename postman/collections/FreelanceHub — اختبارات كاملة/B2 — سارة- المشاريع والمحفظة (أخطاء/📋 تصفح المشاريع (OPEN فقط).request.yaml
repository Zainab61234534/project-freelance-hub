$kind: http-request
url: "{{baseUrl}}/projects"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("كلها OPEN", function () { pm.expect(j.data.every(function (p) { return p.status === "OPEN"; })).to.eql(true); });
      pm.test("pagination موجود", function () { pm.expect(j.pagination).to.have.all.keys("total", "page", "limit", "totalPages"); });
    language: text/javascript
order: 8000
