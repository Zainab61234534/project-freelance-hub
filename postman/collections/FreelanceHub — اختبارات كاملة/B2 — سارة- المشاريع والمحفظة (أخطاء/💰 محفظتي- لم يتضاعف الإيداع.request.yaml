$kind: http-request
name: "💰 محفظتي: لم يتضاعف الإيداع"
url: "{{baseUrl}}/wallet/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("المتاح = 150", function () { pm.expect(parseFloat(j.availableBalance)).to.eql(150); });
      pm.test("المحجوز = 0", function () { pm.expect(parseFloat(j.reservedBalance)).to.eql(0); });
    language: text/javascript
order: 28000
