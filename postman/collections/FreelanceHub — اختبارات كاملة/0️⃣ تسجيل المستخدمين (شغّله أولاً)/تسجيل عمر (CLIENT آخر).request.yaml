$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Omar",
      "email": "omar_{{runId}}@test.com",
      "password": "{{userPassword}}",
      "role": "CLIENT"
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.test("لا تُرجع كلمة المرور", function () { pm.expect(j.password).to.be.undefined; });
      pm.test("الدور صحيح", function () { pm.expect(j.role).to.eql("CLIENT"); });
      if (j.id) { pm.collectionVariables.set("omarId", j.id); }
    language: text/javascript
order: 4000
