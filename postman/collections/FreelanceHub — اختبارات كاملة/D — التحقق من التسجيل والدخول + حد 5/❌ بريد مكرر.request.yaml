$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sara",
      "email": "sara_{{runId}}@test.com",
      "password": "{{userPassword}}",
      "role": "CLIENT"
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 409", function () { pm.expect(pm.response.code).to.be.oneOf([409]); });
    language: text/javascript
order: 5000
