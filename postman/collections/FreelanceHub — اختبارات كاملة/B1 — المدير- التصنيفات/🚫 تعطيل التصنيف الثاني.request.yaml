$kind: http-request
url: "{{baseUrl}}/categories/{{category2Id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "isActive": false
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("isActive=false", function () { pm.expect(j.isActive).to.eql(false); });
    language: text/javascript
order: 10000
