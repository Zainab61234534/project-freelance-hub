$kind: http-request
name: 📋 القائمة لا تحتوي المعطّل (إبطال الكاش)
url: "{{baseUrl}}/categories"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("التصنيف المعطّل غير ظاهر", function () { const ids = j.map(function (c) { return c.id; }); pm.expect(ids).to.not.include(pm.collectionVariables.get("category2Id")); pm.expect(ids).to.include(pm.collectionVariables.get("categoryId")); });
    language: text/javascript
order: 11000
