$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("بريد سارة", function () { pm.expect(j.user.email).to.include("sara_"); });
      pm.test("بدون كلمة مرور", function () { pm.expect(j.user.password).to.be.undefined; });
    language: text/javascript
order: 2000
