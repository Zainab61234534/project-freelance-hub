$kind: http-request
url: "{{baseUrl}}/offers/projects/{{project2Id}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": 80,
      "durationDays": 3,
      "message": "عرض تجريبي من Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 409", function () { pm.expect(pm.response.code).to.be.oneOf([409]); });
    language: text/javascript
order: 5000
