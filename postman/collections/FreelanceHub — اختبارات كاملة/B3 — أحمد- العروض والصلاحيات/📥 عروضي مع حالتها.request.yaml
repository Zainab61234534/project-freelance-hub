$kind: http-request
url: "{{baseUrl}}/offers/my"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("فيها عرض مقبول وعرض معلّق", function () { const s = j.map(function (o) { return o.status; }); pm.expect(s).to.include.members(["ACCEPTED", "PENDING"]); });
    language: text/javascript
order: 15000
