$kind: http-request
url: "{{baseUrl}}/projects/{{project2Id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("[بعد الإصلاح] لا يوجد offers", function () { pm.expect(j.offers).to.be.undefined; });
      pm.test("[بعد الإصلاح] myOffer هو عرضي فقط", function () { pm.expect(j.myOffer.id).to.eql(pm.collectionVariables.get("offerAhmedP2Id")); });
    language: text/javascript
order: 16000
