$kind: collection
description: |-
  FreelanceHub — مجموعة اختبارات Postman

  قبل البدء:
  1) شغّل السيرفر (npm run start:dev) على القاعدة بعد migrate + seed. اجعل NODE_ENV ليس production حتى يُحفظ الكوكي على http.
  2) في متغيرات المجموعة (Variables) ضع adminPassword = قيمة ADMIN_PASSWORD من ملف .env، وعدّل baseUrl إن اختلف المنفذ.
  3) شغّل المجلدات بالترتيب من الأعلى (يمكنك استخدام Collection Runner): 0 ← A1 ← A2 ← B1..B5 ← C ← E ← F ← D.
  4) الدخول محدود بـ 5 محاولات في الدقيقة (حسب الكود). طلبات الدخول هنا تنتظر تلقائياً عند الحاجة، فقد يتأخر التشغيل أحياناً حتى دقيقة.
  5) الكوكي fh_session يُدار تلقائياً بواسطة Postman، وكل طلب 'دخول' يبدّل المستخدم الحالي.
  6) طلب رفع التسليم (A2) يحتاج اختيار ملف PDF أو ZIP صغير يدوياً في حقل file.
  7) الاختبارات المعنونة [بعد الإصلاح] تفشل إن لم تطبّق التعديل المقابل، وهي تشخيصية عمداً.
