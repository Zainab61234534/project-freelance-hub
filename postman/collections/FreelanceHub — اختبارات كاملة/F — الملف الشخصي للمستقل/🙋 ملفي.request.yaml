$kind: http-request
url: "{{baseUrl}}/freelancer-profile/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("النبذة", function () { pm.expect(j.bio).to.eql("مصمم شعارات"); });
    language: text/javascript
order: 4000
