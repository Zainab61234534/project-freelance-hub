$kind: http-request
url: "{{baseUrl}}/freelancer-profile/me"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: bio
      value: مصمم وهوية بصرية
    - type: file
      key: profileImage
      src: []
      disabled: true
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("النبذة تغيّرت", function () { pm.expect(j.bio).to.eql("مصمم وهوية بصرية"); });
    language: text/javascript
order: 5000
