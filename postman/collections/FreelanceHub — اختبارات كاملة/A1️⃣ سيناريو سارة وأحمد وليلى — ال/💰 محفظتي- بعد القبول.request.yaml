$kind: http-request
name: "💰 محفظتي: بعد القبول"
url: "{{baseUrl}}/wallet/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("المتاح = 100", function () { pm.expect(parseFloat(j.availableBalance)).to.eql(100); });
      pm.test("المحجوز = 200", function () { pm.expect(parseFloat(j.reservedBalance)).to.eql(200); });
    language: text/javascript
order: 16000
