$kind: http-request
url: "{{baseUrl}}/offers/projects/{{projectId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("عدد العروض 2", function () { pm.expect(j.length).to.eql(2); });
      pm.test("لا تظهر كلمة مرور المستقل", function () { pm.expect(JSON.stringify(j)).to.not.include("password"); });
    language: text/javascript
order: 14000
