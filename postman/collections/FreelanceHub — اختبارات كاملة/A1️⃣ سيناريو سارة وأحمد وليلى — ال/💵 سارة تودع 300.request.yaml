$kind: http-request
description: يحتاج ترويسة Idempotency-Key (موجودة).
url: "{{baseUrl}}/wallet/deposit"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: dep-{{runId}}-1
body:
  type: json
  content: |-
    {
      "amount": 300
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.test("المتاح 300", function () { pm.expect(parseFloat(j.availableBalance)).to.eql(300); });
    language: text/javascript
order: 5000
