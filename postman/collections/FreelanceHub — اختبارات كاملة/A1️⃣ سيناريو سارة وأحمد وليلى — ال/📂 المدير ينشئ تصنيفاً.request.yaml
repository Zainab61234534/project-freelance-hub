$kind: http-request
url: "{{baseUrl}}/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Design-{{runId}}",
      "description": "تصنيف تصميم للاختبار"
    }
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.test("اسم التصنيف", function () { pm.expect(j.name).to.include("Design-"); });
      if (j.id) { pm.collectionVariables.set("categoryId", j.id); }
    language: text/javascript
order: 2000
