$kind: http-request
description: "multipart/form-data. حقل attachment اختياري (معطّل هنا): فعّله واختر صورة أو PDF حتى 5MB لاختبار المرفق."
url: "{{baseUrl}}/projects"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Logo design {{runId}}
    - type: text
      key: description
      value: وصف المشروع لأغراض الاختبار
    - type: text
      key: budget
      value: "300"
    - type: text
      key: categoryId
      value: "{{categoryId}}"
    - type: file
      key: attachment
      src: []
      disabled: true
scripts:
  - type: afterResponse
    code: |-
      let j = {}; try { j = pm.response.json(); } catch (e) {}
      pm.test("كود الحالة 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      pm.test("الحالة OPEN", function () { pm.expect(j.status).to.eql("OPEN"); });
      if (j.id) { pm.collectionVariables.set("projectId", j.id); }
    language: text/javascript
order: 7000
